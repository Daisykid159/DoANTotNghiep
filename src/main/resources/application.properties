spring.application.name=IT project management system
spring.datasource.url=jdbc:mysql://localhost:3306/it_project
spring.datasource.username=root
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#JPA
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.database-platform = org.hibernate.dialect.MySQL5Dialect
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto = update
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=true


#JWT
jwt.rsa-private-key= classpath:certs/privateKey.pem
jwt.rsa-public-key=  classpath:certs/publicKey.pem


spring.jpa.show-sql=true